<header
  class="sticky top-0 z-50 border-b border-white/5 bg-surface-950/80 backdrop-blur-xl"
>
  <div class="container-page flex h-16 items-center justify-between gap-4 lg:h-18">
    <a href="#inicio" class="flex items-center gap-2 text-sm font-bold tracking-tight sm:text-base">
      <span class="text-brand-400">&lt;/&gt;</span>
      <span>
        Benji <span class="text-brand-400">Rodríguez</span>
      </span>
    </a>

    <nav class="hidden items-center gap-7 lg:flex" aria-label="Principal">
      @for (item of navItems; track item.href) {
        <a
          [href]="item.href"
          class="text-sm font-medium text-ink-400 transition hover:text-ink-100"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-3">
      <div class="hidden sm:block">
        <app-button variant="outline" [href]="cvPath" [download]="cvFilename">
          <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A1.5 1.5 0 004.5 20.25h15a1.5 1.5 0 001.5-1.5V16.5M7.5 12l4.5 4.5L16.5 12M12 3.75v12.75" />
          </svg>
          <span>CV</span>
        </app-button>
      </div>

      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 text-ink-100 transition hover:border-brand-400/40 lg:hidden"
        [attr.aria-expanded]="menuOpen"
        aria-controls="mobile-menu"
        aria-label="Abrir menú"
        (click)="menuToggle.emit()"
      >
        @if (menuOpen) {
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>

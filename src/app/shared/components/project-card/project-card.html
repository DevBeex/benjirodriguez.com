<article
  class="card-surface group flex flex-col overflow-hidden transition duration-300 hover:border-brand-500/30 sm:flex-row lg:flex-col"
>
  <div
    class="relative aspect-[16/10] w-full shrink-0 overflow-hidden bg-surface-850 sm:aspect-auto sm:h-auto sm:w-36 lg:aspect-[16/10] lg:w-full"
  >
    <img
      [src]="project.image"
      [alt]="project.title"
      class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
      loading="lazy"
    />
  </div>

  <div class="flex flex-1 flex-col gap-3 p-4 sm:p-5">
    <div class="flex items-start justify-between gap-3">
      <div>
        <h3 class="text-lg font-semibold text-ink-100">{{ project.title }}</h3>
        <p class="mt-1 text-sm leading-relaxed text-ink-400">{{ project.description }}</p>
      </div>
      <span
        class="mt-1 hidden text-brand-400 transition group-hover:translate-x-0.5 sm:inline lg:hidden"
        aria-hidden="true"
      >
        →
      </span>
    </div>

    <div class="flex flex-wrap gap-2">
      @for (tech of project.technologies; track tech) {
        <app-technology-badge [label]="tech" />
      }
    </div>

    <div class="mt-auto flex gap-4 pt-1 text-sm font-medium">
      @if (project.demoUrl) {
        <a
          [href]="project.demoUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="text-brand-400 transition hover:text-brand-300"
        >
          {{ i18n.t().demo }} ↗
        </a>
      }
      @if (project.repositoryUrl) {
        <a
          [href]="project.repositoryUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="text-ink-400 transition hover:text-ink-100"
        >
          {{ i18n.t().code }} ↗
        </a>
      }
    </div>
  </div>
</article>
